name = "edgesub-manager"
main = "src/worker.js"
compatibility_date = "2026-05-26"

# Cloudflare KV namespace binding.
# Create a KV namespace first, then replace the id below.
[[kv_namespaces]]
binding = "SUB_DB"
id = "00000000000000000000000000000000"

[vars]
ADMIN_USER = "admin"
ADMIN_PATH = "/admin"
